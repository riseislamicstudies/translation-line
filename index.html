<style>
  :root {
    --bg: #F1F3F9; --surface: #FFFFFF; --sunk: #E8ECF5; --fg: #142029; --muted: #586871; --line: #D8DEEA;
    --accent: #3347B8; --accent-fg: #FFFFFF; --accent-soft: #E6EAFC;
    --gold: #8A5F0E; --gold-soft: #F6EBD2; --ok: #1D7048; --ok-soft: #DCEFE4; --bad: #A8312A; --bad-soft: #F6DFDC; --bar: #FFFFFF;
    --f-ui: 'Vazirmatn', system-ui, 'Segoe UI', Tahoma, sans-serif;
    --f-en: 'Literata', Georgia, 'Times New Roman', serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
      --bg: #0F1418; --surface: #161D23; --sunk: #1E272E; --fg: #E4EAEE; --muted: #94A4AD; --line: #2B363E;
      --accent: #8FA9F2; --accent-fg: #0F1418; --accent-soft: #1F2A47; --gold: #E0B85A; --gold-soft: #33291A;
      --ok: #6CCB97; --ok-soft: #173226; --bad: #F08A80; --bad-soft: #3A1E1B; --bar: #12191F; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 15px; line-height: 1.7; }
  button, textarea, input, select { font: inherit; color: inherit; }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: 22px; line-height: 1.4; font-weight: 700; text-wrap: balance; }
  h2 { font-size: 17px; font-weight: 700; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1000px; margin: 0 auto; padding-inline: 16px; }
  [hidden] { display: none !important; }

  .top { position: sticky; top: 0; z-index: 20; background: var(--bar); border-bottom: 1px solid var(--line); }
  .top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark { font-family: var(--f-mono); font-size: 12px; direction: ltr; background: var(--accent); color: var(--accent-fg); padding: 3px 8px; border-radius: 6px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto; min-width: 0; }
  .tab { background: none; border: 0; border-radius: 8px; padding: 5px 12px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .tab:hover { background: var(--sunk); color: var(--fg); }
  .tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .count { font-family: var(--f-mono); font-size: 11px; min-width: 20px; text-align: center; background: var(--sunk); color: var(--fg); border-radius: 99px; padding: 0 6px; }
  .tab[aria-selected="true"] .count { background: var(--accent); color: var(--accent-fg); }
  .who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .bellwrap { position: relative; }
  .bell { background: none; border: 1px solid var(--line); border-radius: 8px; height: 36px; padding: 0 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .bell:hover { background: var(--sunk); }
  .dot { font-family: var(--f-mono); font-size: 11px; background: var(--gold); color: var(--bar); border-radius: 99px; min-width: 18px; text-align: center; padding: 0 5px; }
  .panel { position: absolute; top: calc(100% + 8px); inset-inline-end: 0; z-index: 25; width: min(380px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.18); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .panel ul { list-style: none; margin: 0; padding: 0; }
  .panel li { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .panel li:last-child { border-bottom: 0; }
  .panel li.unread { background: var(--accent-soft); }
  .panel time { display: block; font-size: 12px; color: var(--muted); }

  main { padding-block: 22px 96px; display: flex; flex-direction: column; gap: 18px; }
  .center { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .box { width: min(440px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .sub { color: var(--muted); font-size: 14px; }
  .meta { color: var(--muted); font-size: 13px; }
  .page-head { display: flex; flex-direction: column; gap: 4px; }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-height: 38px; padding: 4px 14px; cursor: pointer; font-weight: 500; }
  .btn:hover { background: var(--sunk); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--bad); }
  .btn.quiet { border-color: transparent; background: none; color: var(--muted); }
  .btn.quiet:hover { background: var(--sunk); color: var(--fg); }
  .btn.small { min-height: 30px; padding: 0 10px; font-size: 13px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input[type=text], input[type=email], input[type=password], input[type=url], select, textarea.plain {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-height: 40px; color: var(--fg);
  }
  input.ltr, textarea.ltr { direction: ltr; text-align: left; font-family: var(--f-mono); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card.err { border-color: var(--bad); background: var(--bad-soft); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; justify-content: space-between; }
  .item-main { min-width: 0; flex: 1 1 240px; }
  .item-title { font-weight: 700; overflow-wrap: anywhere; }
  .chip { display: inline-flex; align-items: center; font-size: 12px; line-height: 1.6; padding: 0 10px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .chip.gold { background: var(--gold-soft); color: var(--gold); }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .num { font-family: var(--f-mono); }
  .callout { border: 1px solid var(--gold); background: var(--gold-soft); border-radius: 10px; padding: 10px 14px; }
  .callout b { color: var(--gold); }
  .stars { display: flex; gap: 2px; }
  .star { background: none; border: 0; padding: 0 2px; cursor: pointer; font-size: 34px; line-height: 1.2; color: var(--line); }
  .star:hover { color: var(--gold); }
  .star.on { color: var(--gold); }
  .stars.sm .star { font-size: 22px; }
  .stars-ro { font-size: 18px; letter-spacing: 1px; white-space: nowrap; }
  .stars-ro .on { color: var(--gold); } .stars-ro .off { color: var(--line); }
  .btn.cm-open { color: var(--gold); border-color: var(--gold); }
  .cmbox { margin-top: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); display: flex; flex-direction: column; gap: 8px; }
  .cmbox[hidden] { display: none; }
  .cm { border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
  .cm:last-child { border-bottom: 0; padding-bottom: 0; }
  .cm.done { opacity: .6; }
  .cm-h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .cm p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cmform { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .cmform textarea { flex: 1 1 220px; min-width: 0; }
  .notice { border: 1px solid var(--line); background: var(--sunk); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .drop { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px; background: var(--surface); position: relative; }
  .vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .filebtn { display: inline-flex; align-items: center; cursor: pointer; }

  .pool { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between; }
  .pool-n { font-size: 40px; font-weight: 700; line-height: 1.1; color: var(--accent); }

  .segs { display: flex; flex-direction: column; gap: 14px; }
  .seg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .seg.flagged { border-color: var(--gold); }
  .seg-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .fa { background: var(--sunk); border-radius: 8px; padding: 10px 12px; font-size: 16px; line-height: 2; overflow-wrap: anywhere; }
  .fa.head, textarea.en.head { font-weight: 700; }
  textarea.t { width: 100%; resize: none; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; display: block; }
  textarea.t:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); }
  textarea.t[readonly] { background: var(--sunk); }
  textarea.en { font-family: var(--f-en); font-size: 17px; line-height: 1.7; direction: ltr; text-align: left; }
  textarea.fa-edit { direction: rtl; text-align: right; font-size: 16px; line-height: 2; }
  .seg-foot { display: flex; flex-wrap: wrap; gap: 4px; }
  .hist { list-style: none; margin: 0; padding: 8px 0 0; display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); }
  .hist li { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
  .hist .by { color: var(--muted); }
  .hist .txt { font-family: var(--f-en); direction: ltr; text-align: left; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
  .mnote { font-size: 13px; background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 6px 12px; direction: ltr; text-align: left; }
  .submitbar { position: sticky; bottom: 0; z-index: 10; background: var(--bar); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .saved { font-family: var(--f-mono); }
  .saved.bad { color: var(--bad); }
  details.gl { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  details.gl summary { cursor: pointer; font-weight: 500; }
  .gl-list { margin: 8px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 16px; font-size: 14px; }
  .gl-list span.en { direction: ltr; font-family: var(--f-en); }

  .diff { font-family: var(--f-en); direction: ltr; text-align: left; font-size: 17px; line-height: 1.8; overflow-wrap: anywhere; }
  .diff ins { text-decoration: none; background: var(--ok-soft); color: var(--ok); border-radius: 3px; padding: 0 2px; }
  .diff del { background: var(--bad-soft); color: var(--bad); border-radius: 3px; padding: 0 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); align-items: center; }
  .legend ins { text-decoration: none; background: var(--ok-soft); color: var(--ok); border-radius: 3px; padding: 0 6px; }
  .legend del { background: var(--bad-soft); color: var(--bad); border-radius: 3px; padding: 0 6px; }
  .final-text { font-family: var(--f-en); direction: ltr; text-align: left; font-size: 16px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--sunk); border-radius: 8px; padding: 12px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat .v { font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1.3; }
  .stat .l { font-size: 13px; color: var(--muted); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 14px; }
  th, td { text-align: start; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: 0; }
  td.wrapok { white-space: normal; min-width: 160px; }
  td input, td select { min-height: 34px; padding: 4px 8px; }
  .bar { display: inline-block; width: 70px; height: 6px; background: var(--sunk); border-radius: 99px; vertical-align: middle; margin-inline-end: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .sub-tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); }
  .sub-tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 12px; cursor: pointer; color: var(--muted); }
  .sub-tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }

  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .9s linear infinite; display: inline-block; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  .toasts { position: fixed; inset: auto 0 0 0; z-index: 40; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 16px 14px; }
  .toast { pointer-events: auto; background: var(--fg); color: var(--bg); border-radius: 10px; padding: 10px 16px; max-width: 560px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }

  /* ============ UI upgrade: modern look, motion, responsive ============ */
  :root {
    --r: 14px; --r-sm: 10px;
    --grad: linear-gradient(135deg, #3F5BD8 0%, #6A4DE0 100%);
    --shadow-1: 0 1px 2px rgba(20,32,41,.06), 0 1px 1px rgba(20,32,41,.04);
    --shadow-2: 0 6px 20px -6px rgba(40,71,154,.22), 0 2px 6px rgba(20,32,41,.06);
    --glass: rgba(255,255,255,.78);
    --ease: cubic-bezier(.22,.8,.3,1);
    --nav-h: 64px;
  }
  :root[data-theme="dark"] { --glass: rgba(18,25,31,.78); --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 8px 24px -8px rgba(0,0,0,.6); --grad: linear-gradient(135deg, #6C86F0 0%, #9276F2 100%); }
  html { scroll-behavior: smooth; }
  body {
    background: radial-gradient(900px 420px at 85% -80px, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
                radial-gradient(700px 360px at 0% 0%, color-mix(in srgb, var(--gold) 9%, transparent), transparent 70%), var(--bg);
    background-attachment: fixed; -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); }
  .wrap { max-width: 1120px; padding-inline: clamp(14px, 3vw, 28px); }

  /* header */
  .top { background: transparent; border-bottom: 1px solid color-mix(in srgb, var(--line) 80%, transparent); }
  .top::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--glass); -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px); }
  .top-in { flex-wrap: nowrap; gap: 14px; padding-block: 10px; }
  .brand { gap: 10px; flex: none; }
  .mark { background: var(--grad); border-radius: 9px; padding: 4px 9px; box-shadow: 0 4px 12px -3px rgba(80,70,220,.5); letter-spacing: .02em; }
  .brand b { font-size: 16px; }
  .tabs { flex-wrap: nowrap; gap: 2px; margin-inline: 8px; }
  .tab { position: relative; border-radius: 10px; padding: 7px 13px; transition: background .2s var(--ease), color .2s var(--ease), transform .15s var(--ease); font-weight: 500; white-space: nowrap; }
  .tab svg { display: none; }
  .tab:active { transform: scale(.96); }
  .tab[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--accent); }
  .count { transition: background .2s, color .2s; }
  .who { gap: 10px; margin-inline-start: auto; flex: none; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--grad); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; box-shadow: 0 3px 10px -2px rgba(80,70,220,.45); flex: none; }
  .who-t { display: flex; flex-direction: column; line-height: 1.25; }
  .who-t b { color: var(--fg); font-size: 13px; font-weight: 500; }
  .who-t small { font-size: 11px; }
  .bell { border-radius: 10px; width: 38px; height: 38px; padding: 0; justify-content: center; position: relative; background: var(--surface); transition: transform .15s var(--ease), background .2s; }
  .bell:active { transform: scale(.94); }
  .bell svg { width: 18px; height: 18px; }
  .bell .bt { display: none; }
  .bell .dot { position: absolute; top: -5px; inset-inline-start: -5px; box-shadow: 0 0 0 2px var(--bar); }
  .dot:not([hidden]) { animation: pop .4s var(--ease); }
  .panel { border-radius: var(--r); box-shadow: var(--shadow-2); animation: drop .22s var(--ease); transform-origin: top; }
  .panel li { transition: background .2s; }
  .panel li:hover { background: var(--sunk); }

  /* surfaces */
  main { padding-block: 26px 110px; gap: 20px; }
  main > * { animation: rise .45s var(--ease) both; }
  main > *:nth-child(2) { animation-delay: .05s; } main > *:nth-child(3) { animation-delay: .1s; }
  main > *:nth-child(4) { animation-delay: .15s; } main > *:nth-child(n+5) { animation-delay: .2s; }
  h1 { font-size: clamp(21px, 2.6vw, 27px); letter-spacing: -.01em; }
  .card, .stat, .seg, details.gl, .table-wrap { border-radius: var(--r); box-shadow: var(--shadow-1); transition: box-shadow .25s var(--ease), border-color .25s, transform .25s var(--ease); }
  .card { padding: clamp(14px, 2vw, 20px); }
  .card:hover, .stat:hover { box-shadow: var(--shadow-2); }
  .card.err { box-shadow: none; }
  .stat { position: relative; overflow: hidden; }
  .stat::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 3px; background: var(--grad); }
  .stat .v { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .list > .card { transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
  @media (hover: hover) { .list > .card:hover { transform: translateY(-2px); } }
  .pool { background: linear-gradient(135deg, var(--accent-soft), var(--surface) 70%); padding: 14px 20px; border-radius: var(--r-sm); margin-bottom: 8px; }
  .pool-n { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* controls */
  .btn { border-radius: var(--r-sm); min-height: 40px; transition: transform .15s var(--ease), background .2s, box-shadow .2s, filter .2s, border-color .2s; }
  .btn:hover { box-shadow: var(--shadow-1); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
  .btn:active:not([disabled]) { transform: scale(.97); }
  .btn.primary { background: var(--grad); border-color: transparent; box-shadow: 0 6px 16px -6px rgba(80,70,220,.6); }
  .btn.primary:hover { filter: brightness(1.07); box-shadow: 0 8px 20px -6px rgba(80,70,220,.7); }
  .btn.danger:hover { background: var(--bad-soft); border-color: var(--bad); }
  .btn.quiet:hover { box-shadow: none; }
  .btn.small { min-height: 32px; }
  input[type=text], input[type=email], input[type=password], input[type=url], select, textarea.plain, textarea.t { border-radius: var(--r-sm); transition: border-color .2s, box-shadow .2s, background .2s; }
  input:focus, select:focus, textarea.plain:focus, textarea.t:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
  textarea.t:focus { outline: none; }
  .chip { padding: 1px 11px; font-weight: 500; }

<body>
<div id="root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script>
(function () {
  'use strict';

  // ===================================================================
  // helpers
  // ===================================================================
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fa = n => Number(n).toLocaleString('fa-IR');
  const pct = x => fa(Math.round(x * 100)) + '٪';
  const clock = () => new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
  const fmtT = iso => iso ? new Date(iso).toLocaleString('fa-IR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  }
  function toast(text) {
    const el = document.createElement('div');
    el.className = 'toast'; el.textContent = text;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
  function grow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; }
  function growAll() { document.querySelectorAll('#main textarea.t').forEach(grow); }

  const words = s => { const t = String(s == null ? '' : s).trim(); return t ? t.split(/\s+/) : []; };
  function wordDist(a, b) {
    const x = words(a), y = words(b);
    if (!x.length) return y.length;
    if (!y.length) return x.length;
    let prev = Array.from({ length: y.length + 1 }, (_, j) => j);
    for (let i = 1; i <= x.length; i++) {
      const cur = [i];
      for (let j = 1; j <= y.length; j++) {
        const cost = x[i - 1] === y[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      }
      prev = cur;
    }
    return prev[y.length];
  }
  function diffOps(a, b) {
    const x = words(a), y = words(b), n = x.length, m = y.length;
    const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const ops = []; let i = 0, j = 0;
    while (i < n && j < m) {
      if (x[i] === y[j]) { ops.push({ t: 'eq', w: x[i] }); i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) { ops.push({ t: 'del', w: x[i] }); i++; }
      else { ops.push({ t: 'ins', w: y[j] }); j++; }
    }
    while (i < n) ops.push({ t: 'del', w: x[i++] });
    while (j < m) ops.push({ t: 'ins', w: y[j++] });
    return ops;
  }
  const terOf = (ai, cur) => ai == null ? 0 : wordDist(ai, cur) / Math.max(1, words(cur).length);

  const STATUS = {
    content_review: ['در بازبینی محتوا', 'accent'], review_rejected: ['بازگشت برای اصلاح متن', 'bad'],
    translating: ['در حال ترجمه ماشینی', 'accent'], translation_failed: ['خطا در ترجمه ماشینی', 'bad'],
    in_pool: ['در سبد', 'accent'], in_progress: ['در حال ترجمه', 'gold'], awaiting_qa: ['در انتظار ناظر', 'gold'],
    changes_requested: ['نیازمند اصلاح', 'bad'], approved: ['آماده انتشار', 'ok'], published: ['منتشر شد', 'ok']
  };
  const ROLE_FA = { none: 'بدون نقش', admin: 'مدیر', reviewer: 'بازبین محتوا', translator: 'مترجم', supervisor: 'ناظر', writer: 'نویسنده' };
  const chip = st => { const [t, k] = STATUS[st] || [st, '']; return `<span class="chip ${k}">${t}</span>`; };

  const ERR = {
    already_claimed: 'این فایل را مترجم دیگری برداشته است.',
    claim_limit_reached: 'حداکثر ۳ فایل را همزمان می‌توانید داشته باشید.',
    not_allowed: 'دسترسی لازم را ندارید.',
    not_editable: 'این فایل اکنون قابل ویرایش نیست.',
    cannot_submit: 'این فایل را نمی‌توان ارسال کرد.',
    cannot_release: 'این فایل را نمی‌توان به سبد برگرداند.',
    cannot_decide: 'این فایل دیگر در انتظار ناظر نیست.',
    priority_required: 'برای تایید، اولویت نشر (۱ تا ۵ ستاره) را انتخاب کنید.',
    priority_invalid: 'رتبه باید بین ۱ و ۵ باشد.',
    cannot_set_priority: 'رتبه فقط برای فایل تاییدشده‌ای که هنوز منتشر نشده قابل تغییر است.',
    cannot_review: 'این فایل دیگر در بازبینی نیست.',
    cannot_resubmit: 'ارسال مجدد ممکن نیست.',
    cannot_retry: 'تلاش دوباره ممکن نیست.',
    cannot_publish: 'فقط فایل تاییدشده را می‌توان منتشر کرد.',
    only_admin_can_change_roles: 'فقط مدیر می‌تواند نقش را تغییر دهد.',
    invite_invalid: 'این لینک دعوت معتبر نیست، منقضی شده یا ظرفیتش پر شده است. از مدیر لینک تازه بخواهید.',
    email_taken: 'با این ایمیل قبلاً حساب ساخته شده است. وارد شوید یا از ایمیل دیگری استفاده کنید.',
    name_required: 'نام و نام خانوادگی را بنویسید.',
    invalid_email: 'ایمیل معتبر نیست.',
    invalid_phone: 'شماره تلفن معتبر نیست.',
    invalid_avatar: 'عکس پذیرفته نشد. عکس دیگری انتخاب کنید.',
    password_too_short: 'رمز باید دست‌کم ۸ نویسه باشد.',
    rate_limited: 'در یک ساعت گذشته فایل زیادی فرستاده‌اید. کمی بعد دوباره تلاش کنید.',
    invalid_input: 'فایل معتبر نیست. متن آن را بررسی کنید.',
    'Invalid login credentials': 'ایمیل یا رمز اشتباه است.',
    'Failed to fetch': 'اتصال برقرار نشد. VPN و اینترنت را بررسی کنید.'
  };
  function errText(e) {
    const m = (e && (e.message || e.error_description || e.error)) || String(e);
    for (const k of Object.keys(ERR)) if (String(m).includes(k)) return ERR[k];
    return String(m);
  }
  async function fnCall(name, body) {
    const { data, error } = await sb.functions.invoke(name, { body });
    if (error) {
      let detail = error.message;
      try { if (error.context && error.context.json) { const j = await error.context.json(); detail = (j.error || '') + (j.detail ? ': ' + j.detail : ''); } } catch (_) { /* keep message */ }
      if (/not found|404/i.test(detail) || /relay|fetch/i.test(detail)) detail += ' (آیا تابع «' + name + '» دیپلوی شده و VPN روشن است؟)';
      throw new Error(detail);
    }
    return data;
  }
  async function rpc(name, args) {
    const { data, error } = await sb.rpc(name, args || {});
    if (error) throw error;
    return data;
  }

  // ===================================================================
  // state
  // ===================================================================
  const LS = 'tl_cfg_v1';
  let cfg = null;
  try { cfg = JSON.parse(localStorage.getItem(LS)); } catch (_) { cfg = null; }
  // A secret key must never be used in a browser: refuse a JWT whose role is service_role.
  function isServiceKey(key) {
    if (/^sb_secret_/.test(key)) return true;
    try { return JSON.parse(atob(key.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).role === 'service_role'; } catch (_) { return false; }
  }
  // Invite link: https://.../index.html#cfg=<base64url of {"url","key"}>
  // It fills in the connection once, then the code is removed from the address bar.
  let INVITE = null;
  try { INVITE = sessionStorage.getItem('tl_invite') || null; } catch (_) { INVITE = null; }
  (function applyInviteLink() {
    const m = /^#cfg=([A-Za-z0-9_-]+)(?:&invite=([0-9a-f]{20,64}))?$/.exec(location.hash || ''); if (!m) return;
    if (m[2]) { INVITE = m[2]; try { sessionStorage.setItem('tl_invite', INVITE); } catch (_) { /* ignore */ } }
    try {
      const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
      const j = JSON.parse(atob(b64 + '==='.slice((b64.length + 3) % 4)));
      if (/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(j.url) && /^eyJ|^sb_publishable_/.test(j.key) && !isServiceKey(j.key)) {
        cfg = { url: j.url, key: j.key };
        try { localStorage.setItem(LS, JSON.stringify(cfg)); } catch (_) { /* storage may be blocked */ }
      }
    } catch (_) { /* a damaged link is ignored; the setup form appears instead */ }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (_) { /* ignore */ }
  })();
  let sb = null, me = null, channel = null, pollT = null, renderTok = 0;
  const S = { tab: null, docId: null, qa: null, adminTab: 'users', confirm: null, names: {}, notifs: [], unread: 0, panel: false, pubText: {}, counts: {}, users: null, busy: '', star: null, printMin: null, cm: {}, cmOpen: {}, cmDoc: null };

  // ===================================================================
  // setup + login
  // ===================================================================
  function viewSetup(msg) {
    $('#root').innerHTML = `${themeBtn('float')}<div class="center"><form class="box card" id="setupForm">
      <h1>اتصال به Supabase</h1>
      <p class="sub">این دو مقدار را از Supabase بردارید: Project Settings ← API. فقط کلید <b>anon (public)</b> را بگذارید، نه service_role.</p>
      ${msg ? `<div class="callout">${esc(msg)}</div>` : ''}
      <label class="f">Project URL<input class="ltr" type="url" id="cfgUrl" placeholder="https://xxxx.supabase.co" value="${esc(cfg && cfg.url || '')}" required></label>
      <label class="f">anon public key<input class="ltr" type="text" id="cfgKey" placeholder="eyJ..." value="${esc(cfg && cfg.key || '')}" required></label>
      <button class="btn primary" type="submit" id="cfgBtn">آزمایش و ذخیره</button>
      <p class="meta">این اطلاعات فقط در همین مرورگر ذخیره می‌شود.</p>
    </form></div>`;
  }
  async function saveSetup() {
    const url = $('#cfgUrl').value.trim().replace(/\/+$/, '');
    const key = $('#cfgKey').value.trim();
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)) return viewSetup('آدرس باید مثل https://abcdxyz.supabase.co باشد (بدون / یا مسیر اضافه).');

      await rpc('writer_submit', { p_id: id, p_title: title, p_filename: file.name, p_path: path, p_segments: segs.map(x => ({ kind: x.kind, text: x.text })) });

  // ===================================================================
  // DOCX parsing
  // ===================================================================
  async function parseDocx(file) {
    const buf = await file.arrayBuffer();
    const res = await mammoth.convertToHtml({ arrayBuffer: buf });
    const doc = new DOMParser().parseFromString(res.value, 'text/html');
    const segs = [];
    const add = (kind, text) => { text = String(text).replace(/\s+/g, ' ').trim(); if (text) segs.push({ kind, text }); };
    doc.body.childNodes.forEach(n => {
      if (n.nodeType !== 1) return;
      const tag = n.tagName.toLowerCase();
      if (/^h[1-6]$/.test(tag)) add('heading', n.textContent);
      else if (tag === 'ul' || tag === 'ol') [...n.querySelectorAll('li')].forEach((li, i) => add('list_item', (tag === 'ol' ? (i + 1) + '. ' : '- ') + li.textContent));
      else if (tag === 'table') [...n.querySelectorAll('tr')].forEach(tr => add('paragraph', [...tr.children].map(c => c.textContent.trim()).join(' | ')));
      else add('paragraph', n.textContent);
    });
    return segs;
  }
  async function insertDoc(title, filename, path, segs) {
    const id = uuid();
    const wc = segs.reduce((n, s) => n + words(s.text).length, 0);
    const ins = await sb.from('documents').insert({ id, title, source_filename: filename, source_path: path ? path(id) : null, word_count: wc, uploaded_by: me.id });
    if (ins.error) throw ins.error;
    const rows = segs.map((s, i) => ({ document_id: id, position: i + 1, kind: s.kind, source_text: s.text }));
    for (let i = 0; i < rows.length; i += 200) {
      const r = await sb.from('segments').insert(rows.slice(i, i + 200));
      if (r.error) { await sb.from('documents').delete().eq('id', id); throw r.error; }
    }
    return id;
  }
  async function doUpload(file) {
    if (!/\.docx$/i.test(file.name)) throw new Error('فقط فایل DOCX پذیرفته می‌شود.');
    if (file.size > 8 * 1024 * 1024) throw new Error('حجم فایل بیشتر از ۸ مگابایت است.');
    S.busy = 'upload'; toast('در حال خواندن فایل…');
    try {
      const segs = await parseDocx(file);
      if (!segs.length) throw new Error('متنی در فایل پیدا نشد.');
      if (segs.length > 2000) throw new Error('تعداد بندها بیش از حد مجاز (۲۰۰۰) است.');
      const title = file.name.replace(/\.docx$/i, '');
      // upload the original first (best effort); the path uses the new document id
      const id = uuid();
      let storedPath = null;
      const up = await sb.storage.from('source-files').upload(id + '/source.docx', file, { contentType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
      if (!up.error) storedPath = id + '/source.docx';
      const wc = segs.reduce((n, s) => n + words(s.text).length, 0);
      const ins = await sb.from('documents').insert({ id, title, source_filename: file.name, source_path: storedPath, word_count: wc, uploaded_by: me.id });
      if (ins.error) throw ins.error;
      const rows = segs.map((s, i) => ({ document_id: id, position: i + 1, kind: s.kind, source_text: s.text }));
      for (let i = 0; i < rows.length; i += 200) {
        const r = await sb.from('segments').insert(rows.slice(i, i + 200));
        if (r.error) { await sb.from('documents').delete().eq('id', id); throw r.error; }
      }
      S.docId = id;
      toast(`«${title}» بارگذاری شد: ${fa(segs.length)} بند، ${fa(wc)} کلمه`);
    } finally { S.busy = ''; }
    render();
  }

  // ---- autosave -----------------------------------------------------
  const pending = {}, chain = {};
  const st = sid => pending[sid] || (pending[sid] = { secs: 0, dirty: false, startedAt: null, timer: null });
  function setSaved(text, bad) { const el = $('#saved'); if (el) { el.textContent = text; el.classList.toggle('bad', !!bad); } }
  function queueSave(sid) { chain[sid] = (chain[sid] || Promise.resolve()).then(() => doSave(sid)).catch(() => { /* shown in status line */ }); return chain[sid]; }
  async function doSave(sid) {
    const ta = document.getElementById('ta-' + sid); if (!ta || ta.readOnly) return;
    const s = st(sid); const secs = s.secs;
    if (!s.dirty && secs < 3) return;
    const wasDirty = s.dirty; s.secs = 0; s.dirty = false;
    setSaved('در حال ذخیره…');
    const { error } = await sb.rpc('save_segment', { p_segment: sid, p_text: ta.value, p_seconds: secs });
    if (error) { s.secs += secs; s.dirty = s.dirty || wasDirty; setSaved('ذخیره نشد: ' + errText(error), true); throw error; }
    if (segMap[sid]) segMap[sid].current_text = ta.value;
    setSaved('ذخیره شد · ' + clock());
  }

      queueSave(ta.dataset.sid);
    });
    await Promise.all(Object.values(chain));
    const bad = document.querySelector('#saved.bad');
    if (bad) throw new Error('بعضی تغییرات ذخیره نشده است. دوباره تلاش کنید.');

      const { data, error } = await sb.from('segment_comments').select('id,segment_id,author_id,body,resolved,created_at').eq('document_id', docId).order('created_at');
      if (error) throw error;
      data.forEach(c => { (S.cm[c.segment_id] = S.cm[c.segment_id] || []).push(c); });
    } catch (_) { /* comments are optional: the page still works without them */ }
  }
  function cmUnresolved(sid) { return (S.cm[sid] || []).filter(c => !c.resolved).length; }
  function cmIsOpen(sid) { return S.cmOpen[sid] !== undefined ? S.cmOpen[sid] : cmUnresolved(sid) > 0; }
  function cmBtnLabel(sid) {
    const a = S.cm[sid] || [], u = cmUnresolved(sid);
    return a.length ? `نظرها (${fa(a.length)}${u ? ' · ' + fa(u) + ' حل‌نشده' : ''})` : 'نظر';
  }
  function cmButton(sid) {
    return `<button type="button" class="btn quiet small${cmUnresolved(sid) ? ' cm-open' : ''}" data-act="cmtoggle" data-sid="${sid}" data-cmbtn="${sid}">${cmBtnLabel(sid)}</button>`;
  }
  function cmListHtml(sid) {
    const a = S.cm[sid] || [];
    if (!a.length) return '<p class="meta">هنوز نظری نیست.</p>';
    return a.map(c => `<div class="cm${c.resolved ? ' done' : ''}"><div class="cm-h"><b>${esc(nm(c.author_id))}</b><span class="meta">${fmtT(c.created_at)}</span>${c.resolved ? '<span class="chip ok">حل‌شد</span>' : ''}<button type="button" class="btn quiet small" data-act="cmresolve" data-id="${c.id}" data-sid="${sid}" data-v="${c.resolved ? 0 : 1}">${c.resolved ? 'بازکردن دوباره' : 'حل‌شد'}</button></div><p>${esc(c.body)}</p></div>`).join('');
  }
  function cmBox(sid) {
    return `<div class="cmbox" data-cmbox="${sid}"${cmIsOpen(sid) ? '' : ' hidden'}><div data-cmlist="${sid}">${cmListHtml(sid)}</div><div class="cmform"><textarea class="plain" rows="2" id="cmin-${sid}" data-cmin="${sid}" aria-label="نظر جدید" placeholder="نظر بنویسید…"></textarea><button type="button" class="btn small primary" data-act="cmadd" data-sid="${sid}">ثبت نظر</button></div></div>`;
  }
  function cmRefresh(sid) {
    const l = document.querySelector(`[data-cmlist="${sid}"]`); if (l) l.innerHTML = cmListHtml(sid);
    const b = document.querySelector(`[data-cmbtn="${sid}"]`);
    if (b) { b.textContent = cmBtnLabel(sid); b.classList.toggle('cm-open', cmUnresolved(sid) > 0); }
  }
  async function cmRefreshFor(docId) {
    if (S.cmDoc !== docId || !(S.docId === docId || S.qa === docId)) return;
    await loadComments(docId);
    document.querySelectorAll('[data-cmlist]').forEach(el => cmRefresh(el.dataset.cmlist));

  const RATING_LABEL = ['', 'کم‌اهمیت', 'معمولی', 'مهم', 'بسیار مهم', 'خبر اصلی'];
  async function loadPrintMin() {
    try {
      const { data, error } = await sb.from('app_config').select('value').eq('key', 'print_min_priority').maybeSingle();
      const v = Number(data && data.value);
      if (!error && v >= 1 && v <= 5) S.printMin = v;
    } catch (_) { /* keep the previous value */ }
    if (!S.printMin) S.printMin = 4;
    return S.printMin;
  }
  function starsStatic(n) {
    if (!n) return '<span class="chip">بدون رتبه</span>';

    return `<span class="stars sm" role="group" aria-label="رتبه">${[1, 2, 3, 4, 5].map(i => `<button type="button" class="star${n >= i ? ' on' : ''}" data-act="setprio" data-id="${id}" data-n="${i}" aria-label="${fa(i)} ستاره" title="${RATING_LABEL[i]}">★</button>`).join('')}</span>`;

  VIEWS.qa = async function () {
    if (S.qa) return vQA();

    if (error) throw error;
    let q = {};

      const r = await sb.from('document_quality').select('document_id,segments,unchanged_pct,ter').in('document_id', data.map(d => d.id));
      (r.data || []).forEach(x => { q[x.document_id] = x; });
    }
    return head('بازبینی ناظر', 'تفاوت ترجمه ماشینی و ترجمه مترجم را ببینید، سپس تایید کنید یا با یادداشت برگردانید.') +
      (data.length ? `<div class="list">${data.map(d => { const x = q[d.id]; return `<article class="card"><div class="item"><div class="item-main"><div class="item-title">${esc(d.title)}</div>
        <div class="meta">مترجم: ${esc(nm(d.claimed_by))} · ${fa(d.word_count)} کلمه${x ? ` · بدون تغییر ${fa(x.unchanged_pct)}٪ · TER ${pct(Number(x.ter))}` : ''}</div></div>
        <button type="button" class="btn primary" data-act="qaopen" data-id="${d.id}">بررسی</button></div></article>`; }).join('')}</div>` : emptyCard('فایلی در انتظار ناظر نیست.'));
  };
  async function vQA() {
    const id = S.qa;
    const [d, s] = await Promise.all([sb.from('documents').select('*').eq('id', id).single(), sb.from('segments').select('*').eq('document_id', id).order('position')]);
    if (d.error) { S.qa = null; throw d.error; }
    if (d.data.status !== 'awaiting_qa') { S.qa = null; return VIEWS.qa(); }
    const doc = d.data, segs = s.data;
    await loadComments(id);
    const pm = await loadPrintMin();
    const changed = segs.filter(g => g.current_text !== g.ai_text).length;
    const dist = segs.reduce((n, g) => n + wordDist(g.ai_text, g.current_text), 0);
    const fin = segs.reduce((n, g) => n + Math.max(1, words(g.current_text).length), 0);
    return `<div><button type="button" class="btn quiet" data-act="qaback">→ فهرست</button></div>
      <section class="page-head"><h1>${esc(doc.title)}</h1><p class="sub">مترجم: ${esc(nm(doc.claimed_by))} · ${fa(changed)} از ${fa(segs.length)} بند ویرایش شده · TER ${pct(dist / fin)} · ${fa(segs.reduce((n, g) => n + g.seconds_spent, 0) / 60 | 0)} دقیقه زمان ثبت‌شده</p></section>
      <div class="legend"><span>راهنما:</span><del>حذف‌شده از ترجمه ماشینی</del><ins>افزوده‌شده توسط مترجم</ins></div>
      <div class="segs">${segs.map((g, i) => {
        const same = g.current_text === g.ai_text;
        const body = same ? `<p class="diff">${esc(g.current_text)}</p>` : `<p class="diff">${diffOps(g.ai_text, g.current_text).map(o => o.t === 'eq' ? esc(o.w) : o.t === 'del' ? `<del>${esc(o.w)}</del>` : `<ins>${esc(o.w)}</ins>`).join(' ')}</p>`;
        return `<article class="seg${g.flagged ? ' flagged' : ''}"><div class="seg-head"><span>بند ${fa(i + 1)}</span><span>${same ? '<span class="chip ok">بدون تغییر</span>' : `<span class="chip gold">TER ${pct(terOf(g.ai_text, g.current_text))}</span>`}${g.flagged ? ' <span class="chip bad">پرچم‌دار</span>' : ''}</span></div>
          <p class="fa${g.kind === 'heading' ? ' head' : ''}" lang="fa" dir="rtl">${esc(g.source_text)}</p>${body}<div class="seg-foot">${cmButton(g.id)}</div>${cmBox(g.id)}</article>`;
      }).join('')}</div>
      <section class="card"><div><b>اولویت نشر</b> <span class="meta">(برای تایید لازم است)</span></div>
        <div class="stars" id="starRow" role="group" aria-label="اولویت نشر از ۱ تا ۵">${[1, 2, 3, 4, 5].map(i => `<button type="button" class="star" data-act="star" data-n="${i}" aria-label="${fa(i)} ستاره" title="${RATING_LABEL[i]}">★</button>`).join('')}</div>
        <p class="meta" id="starHint" aria-live="polite">رتبه ۱ (کم‌اهمیت) تا ۵ (خبر اصلی). رتبه ${fa(pm)} و بالاتر در نشریه و سایت، پایین‌تر فقط در سایت.</p></section>
      <section class="card"><label class="f"><b style="color:var(--fg)">یادداشت برای مترجم</b> (برای بازگرداندن لازم است)<textarea class="plain" id="qaNote" rows="3" dir="rtl" placeholder="مثلاً: اصطلاح بند دوم را با واژه‌نامه سازمان یکدست کنید."></textarea></label>
        <div class="row"><button type="button" class="btn primary" data-act="qaapprove" data-id="${id}">تایید و ارسال به سبد انتشار</button><button type="button" class="btn" data-act="qareturn" data-id="${id}">بازگرداندن به مترجم</button></div></section>`;
  }

  // ===================================================================
  // view: ready to publish
  // ===================================================================
  VIEWS.pub = async function () {
    const pm = await loadPrintMin();
    const { data, error } = await sb.from('documents').select('id,title,status,claimed_by,supervisor_id,word_count,updated_at,priority').in('status', ['approved', 'published']).order('updated_at', { ascending: false });
    if (error) throw error;
    const canPub = ['admin', 'supervisor'].includes(me.role);
    const approved = data.filter(d => d.status === 'approved');
    const published = data.filter(d => d.status === 'published').slice(0, 30);
    const byPrio = (x, y) => (y.priority || 0) - (x.priority || 0) || new Date(y.updated_at) - new Date(x.updated_at);
    const print = approved.filter(d => d.priority >= pm).sort(byPrio);
    const site = approved.filter(d => d.priority && d.priority < pm).sort(byPrio);
    const none = approved.filter(d => !d.priority);
    const card = d => `<article class="card"><div class="item"><div class="item-main"><div class="item-title">${esc(d.title)}</div><div class="meta">مترجم: ${esc(nm(d.claimed_by))} · ناظر: ${esc(nm(d.supervisor_id))} · ${fmtT(d.updated_at)}</div></div>
        <div class="row">${canPub && d.status === 'approved' ? starsEdit(d.id, d.priority || 0) : starsStatic(d.priority)}${chip(d.status)}</div></div>
        <div class="row"><button type="button" class="btn" data-act="pubshow" data-id="${d.id}">${S.pubText[d.id] ? 'بستن متن' : 'دیدن متن انگلیسی'}</button>
        <button type="button" class="btn" data-act="pubcopy" data-id="${d.id}">کپی متن</button>
        <button type="button" class="btn" data-act="pubdl" data-id="${d.id}" data-title="${esc(d.title)}">دانلود فایل Word</button>
        ${canPub && d.status === 'approved' ? `<button type="button" class="btn primary" data-act="publish" data-id="${d.id}">علامت‌گذاری به‌عنوان منتشرشده</button>` : ''}</div>
        ${S.pubText[d.id] ? `<div class="final-text" lang="en" dir="ltr">${esc(S.pubText[d.id].map(g => g.current_text).join('\n\n'))}</div>` : ''}</article>`;
    const section = (title, sub, list) => `<section class="list"><h2>${title} <span class="chip">${fa(list.length)}</span></h2><p class="meta">${sub}</p>${list.length ? list.map(card).join('') : emptyCard('موردی نیست.')}</section>`;
    return head('آماده انتشار', 'ترجمه‌های تاییدشده ناظر، دسته‌بندی‌شده بر اساس رتبه اولویت.') +
      section('نشریه', `رتبه ${fa(pm)} تا ۵، از بالاترین اولویت`, print) +
      (pm > 1 ? section('فقط سایت', `رتبه ۱ تا ${fa(pm - 1)}`, site) : '') +
      (none.length ? section('بدون رتبه', 'تاییدشده‌های قبل از رتبه‌بندی. با ستاره‌ها رتبه بدهید.', none) : '') +
      (published.length ? section('منتشرشده', '۳۰ مورد اخیر', published) : '');
  };
  async function getFinal(id) {
    if (S.pubText[id]) return S.pubText[id];
    const { data, error } = await sb.from('segments').select('kind,current_text,position').eq('document_id', id).order('position');

    return data;
  }

  VIEWS.quality = async function () {

    if (docs.error) throw docs.error;
    const D = docs.data || [], T = trs.data || [];
    const tot = D.reduce((a, d) => a + Number(d.segments || 0), 0);
    const unch = D.reduce((a, d) => a + Number(d.segments || 0) * Number(d.unchanged_pct || 0) / 100, 0);
    const ter = D.length ? D.reduce((a, d) => a + Number(d.ter || 0), 0) / D.length : 0;
    const byModel = {};
    D.forEach(d => { const k = d.ai_model || '—'; (byModel[k] = byModel[k] || []).push(d); });
    return head('کیفیت ترجمه ماشینی', 'مقایسه خروجی Gemini با متن نهایی مترجم. TER یعنی نسبت کلمات ویرایش‌شده به کلمات متن نهایی؛ هرچه کمتر، ترجمه ماشینی به متن نهایی نزدیک‌تر بوده است.') + `
      <div class="stats"><div class="stat"><div class="v">${tot ? pct(unch / tot) : '—'}</div><div class="l">بندهای بدون تغییر</div></div><div class="stat"><div class="v">${D.length ? pct(ter) : '—'}</div><div class="l">میانگین TER</div></div><div class="stat"><div class="v">${fa(D.length)}</div><div class="l">فایل تحویل‌شده</div></div></div>
      <div class="table-wrap"><table><thead><tr><th>فایل</th><th>مترجم</th><th>مدل</th><th>بندها</th><th>بدون تغییر</th><th>TER</th><th>زمان</th></tr></thead><tbody>
        ${D.length ? D.map(d => `<tr><td class="wrapok">${esc(d.title)}</td><td>${esc(nm(d.translator_id))}</td><td class="num">${esc(d.ai_model || '—')}</td><td class="num">${fa(d.segments)}</td>
          <td><span class="bar"><i style="width:${Math.round(Number(d.unchanged_pct || 0))}%"></i></span><span class="num">${fa(d.unchanged_pct)}٪</span></td><td class="num">${pct(Number(d.ter || 0))}</td><td class="num">${fa(Math.round(Number(d.seconds_total || 0) / 60))} دقیقه</td></tr>`).join('') : '<tr><td colspan="7" class="meta">هنوز فایلی تحویل داده نشده است.</td></tr>'}</tbody></table></div>
      ${T.length ? `<h2>به تفکیک مترجم</h2><div class="table-wrap"><table><thead><tr><th>مترجم</th><th>فایل</th><th>میانگین بدون تغییر</th><th>میانگین TER</th></tr></thead><tbody>${T.map(t => `<tr><td>${esc(t.full_name)}</td><td class="num">${fa(t.documents)}</td><td class="num">${fa(t.avg_unchanged_pct)}٪</td><td class="num">${pct(Number(t.avg_ter || 0))}</td></tr>`).join('')}</tbody></table></div>` : ''}
      ${Object.keys(byModel).length > 1 ? `<h2>به تفکیک مدل</h2><div class="table-wrap"><table><thead><tr><th>مدل</th><th>فایل</th><th>میانگین TER</th></tr></thead><tbody>${Object.entries(byModel).map(([m, a]) => `<tr><td class="num">${esc(m)}</td><td class="num">${fa(a.length)}</td><td class="num">${pct(a.reduce((x, d) => x + Number(d.ter || 0), 0) / a.length)}</td></tr>`).join('')}</tbody></table></div>` : ''}`;

    async pubcopy(el) {
      const text = (await getFinal(el.dataset.id)).map(g => g.current_text).join('\n\n');
      try { await navigator.clipboard.writeText(text); toast('متن کپی شد.'); }
      catch (_) { S.pubText[el.dataset.id] = await getFinal(el.dataset.id); render(); toast('کپی خودکار ممکن نشد. متن را انتخاب و کپی کنید.'); }
    },
    async pubdl(el) {
      const segs = await getFinal(el.dataset.id);
      const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>' + esc(el.dataset.title) + '</title></head><body style="font-family:Times New Roman;font-size:12pt">' +
        segs.map(g => g.kind === 'heading' ? `<h2>${esc(g.current_text)}</h2>` : `<p>${esc(g.current_text)}</p>`).join('') + '</body></html>';
      const url = URL.createObjectURL(new Blob(['﻿', html], { type: 'application/msword' }));
      const a = document.createElement('a'); a.href = url; a.download = (el.dataset.title || 'translation').replace(/[\\/:*?"<>|]+/g, '_') + '.doc';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    },
    async publish(el) { await rpc('mark_published', { p_doc: el.dataset.id }); toast('علامت‌گذاری شد.'); render(); },
    admintab(el) { S.adminTab = el.dataset.tab; render(); },
    async setpass(el) {
      const i = document.querySelector(`[data-ppass="${el.dataset.id}"]`);
      await fnCall('manage-users', { action: 'set_password', user_id: el.dataset.id, password: i.value });
      i.value = ''; toast('رمز تغییر کرد.');
    },
    genpass() { const c = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const b = crypto.getRandomValues(new Uint8Array(12)); $('#nuPass').value = [...b].map(x => c[x % c.length]).join(''); },
    async activateprompt(el) {
      const a = await sb.from('prompts').update({ is_active: false }).eq('is_active', true); if (a.error) throw a.error;
      const b = await sb.from('prompts').update({ is_active: true }).eq('id', el.dataset.id); if (b.error) throw b.error;
      toast('فعال شد.'); render();
    },
    async delkey() { await rpc('set_secret', { p_name: 'GEMINI_API_KEY', p_value: '' }); toast('کلید حذف شد.'); render(); },
    async sampledoc() {
      const id = await insertDoc('فایل آزمایشی ' + clock(), null, null, [
        { kind: 'heading', text: 'مقدمه‌ای بر مطالعات ترجمه' },
        { kind: 'paragraph', text: 'ترجمه تنها انتقال واژگان نیست؛ انتقال نظامی از معنا از یک زبان به زبان دیگر است.' },
        { kind: 'paragraph', text: 'در این پژوهش، چگونگی حفظ دقت علمی در ترجمه متون دانشگاهی بررسی می‌شود.' }
      ]);
      toast('فایل آزمایشی ساخته شد. در تب «بازبین محتوا» تایید کنید.'); S.tab = 'review'; S.docId = id; render();
    },
    async adminrelease(el) { await rpc('release_document', { p_doc: el.dataset.id }); toast('به سبد برگشت.'); render(); }
  };
  function segUpdate(sid) {
    const g = segMap[sid]; const ta = document.getElementById('ta-' + sid); if (!g || !ta) return;
    const chips = document.querySelector(`[data-chips="${sid}"]`);
    if (chips) chips.innerHTML = segChips({ ...g, current_text: ta.value });
    refreshEditedCount();
  }

  document.addEventListener('click', async e => {
    const bell = e.target.closest('.bellwrap');
    if (S.panel && !bell) { S.panel = false; setBell(); }
    const el = e.target.closest('[data-act]'); if (!el) return;
    const fn = ACT[el.dataset.act]; if (!fn) return;
    const wasDisabled = el.disabled; el.disabled = true;
    try { await fn(el); } catch (err) { toast(errText(err)); }
    if (document.body.contains(el)) el.disabled = wasDisabled;
  });
  document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#wDrop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#wDrop'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', async e => {
    const d = e.target.closest && e.target.closest('#wDrop'); if (!d) return;
    e.preventDefault(); d.classList.remove('over');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    try { if (f) await doWriterUpload(f); } catch (err) { toast(errText(err)); }
  });
  document.addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target; const btn = f.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
    try {
      if (f.id === 'setupForm') return await saveSetup();
      if (f.id === 'loginForm') return await doLogin();
      if (f.id === 'signupForm') return await doSignup();
      if (f.id === 'newUser') {
        await fnCall('manage-users', { action: 'create', email: $('#nuEmail').value, password: $('#nuPass').value, full_name: $('#nuName').value, role: $('#nuRole').value });
        toast('کاربر ساخته شد.'); await loadNames(); return render();
      }
      if (f.id === 'promptForm') {
        const body = $('#pBody').value, model = $('#pModel').value.trim();
        if (!body.includes('{{PARAGRAPHS_JSON}}')) throw new Error('متن پرامپت باید شامل {{PARAGRAPHS_JSON}} باشد.');
        if (!model) throw new Error('نام مدل را بنویسید.');
        const cur = await sb.from('prompts').select('name,version').order('version', { ascending: false }).limit(1).single();
        const name = cur.data ? cur.data.name : 'academic-fa-en', ver = cur.data ? cur.data.version + 1 : 1;
        const d = await sb.from('prompts').update({ is_active: false }).eq('is_active', true); if (d.error) throw d.error;
        const i = await sb.from('prompts').insert({ name, version: ver, model, body, is_active: true, created_by: me.id });
        if (i.error) throw i.error;
        toast('نسخه ' + fa(ver) + ' ذخیره و فعال شد.'); return render();
      }
      if (f.id === 'keyForm') {
        const v = $('#gKey').value.trim(); if (!v) throw new Error('کلید را وارد کنید.');
        await rpc('set_secret', { p_name: 'GEMINI_API_KEY', p_value: v }); toast('کلید ذخیره شد.'); return render();
      }
    } catch (err) {
      if (f.id === 'loginForm') viewLogin(errText(err)); else toast(errText(err));
    } finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'wBase') { S.wBase = t.value.trim(); try { localStorage.setItem('tl_base', S.wBase); } catch (_) { /* ignore */ } }
    if (t.matches('textarea.t')) grow(t);
    if (t.matches('textarea[data-sid]') && !t.readOnly) {
      const s = st(t.dataset.sid); s.dirty = true; segUpdate(t.dataset.sid); setSaved('در حال ویرایش…');
      clearTimeout(s.timer); s.timer = setTimeout(() => queueSave(t.dataset.sid), 1500);
    }
  });
  document.addEventListener('focusin', e => { const t = e.target; if (t.matches && t.matches('textarea[data-sid]')) st(t.dataset.sid).startedAt = Date.now(); });
  document.addEventListener('focusout', e => {
    const t = e.target;
    if (t.matches && t.matches('textarea[data-sid]')) {
      const s = st(t.dataset.sid);
      if (s.startedAt) { s.secs += Math.min(600, Math.round((Date.now() - s.startedAt) / 1000)); s.startedAt = null; }
      clearTimeout(s.timer); queueSave(t.dataset.sid);
    }
  });
  document.addEventListener('change', async e => {
    const t = e.target;
    try {
      if (t.id === 'fileIn') { const f = t.files && t.files[0]; if (f) await doUpload(f); t.value = ''; }
      else if (t.id === 'wFile') { const f = t.files && t.files[0]; t.value = ''; if (f) await doWriterUpload(f); }
      else if (t.id === 'suAvatar') {
        const f = t.files && t.files[0]; t.value = ''; if (!f) return;
        AVATAR = await resizeAvatar(f);
        const pv = $('#suPrev'); pv.style.backgroundImage = `url(${AVATAR})`; pv.classList.add('has'); pv.innerHTML = '';
      }
      else if (t.matches('textarea[data-fa]')) { const { error } = await sb.from('segments').update({ source_text: t.value }).eq('id', t.dataset.fa); if (error) throw error; }
      else if (t.matches('[data-prole]')) { const { error } = await sb.from('profiles').update({ role: t.value }).eq('id', t.dataset.prole); if (error) throw error; toast('نقش ذخیره شد.'); await loadNames(); }
      else if (t.matches('[data-pname]')) { const { error } = await sb.from('profiles').update({ full_name: t.value.trim() }).eq('id', t.dataset.pname); if (error) throw error; toast('نام ذخیره شد.'); await loadNames(); }
      else if (t.matches('[data-pnotify]')) { const { error } = await sb.from('profiles').update({ notify: t.checked }).eq('id', t.dataset.pnotify); if (error) throw error; toast('ذخیره شد.'); }
    } catch (err) { toast(errText(err)); S.busy = ''; if (me) render(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.panel) { S.panel = false; setBell(); } });
  window.addEventListener('beforeunload', e => {
    const dirty = Object.values(pending).some(p => p.dirty);
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  boot();
})();
</script>
</body>
</html>
