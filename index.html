<style>
  :root {

  .top { position: sticky; top: 0; z-index: 20; background: var(--bar); border-bottom: 1px solid var(--line); }

  .bellwrap { position: relative; }

  .dot { font-family: var(--f-mono); font-size: 11px; background: var(--gold); color: var(--bar); border-radius: 99px; min-width: 18px; text-align: center; padding: 0 5px; }
  .panel { position: absolute; top: calc(100% + 8px); inset-inline-end: 0; z-index: 25; width: min(380px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.18); }

  main { padding-block: 22px 96px; display: flex; flex-direction: column; gap: 18px; }

  .page-head { display: flex; flex-direction: column; gap: 4px; }

  }
  input.ltr, textarea.ltr { direction: ltr; text-align: left; font-family: var(--f-mono); font-size: 13px; }

  .btn.cm-open { color: var(--gold); border-color: var(--gold); }

  .cm { border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
  .cm:last-child { border-bottom: 0; padding-bottom: 0; }
  .cm.done { opacity: .6; }
  .cm-h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .cm p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cmform { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .cmform textarea { flex: 1 1 220px; min-width: 0; }
  .notice { border: 1px solid var(--line); background: var(--sunk); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .drop { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px; background: var(--surface); position: relative; }
  .vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

  .pool { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between; }
  .pool-n { font-size: 40px; font-weight: 700; line-height: 1.1; color: var(--accent); }

  .segs { display: flex; flex-direction: column; gap: 14px; }
  .seg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .seg.flagged { border-color: var(--gold); }
  .seg-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .fa { background: var(--sunk); border-radius: 8px; padding: 10px 12px; font-size: 16px; line-height: 2; overflow-wrap: anywhere; }
  .fa.head, textarea.en.head { font-weight: 700; }

  .seg-foot { display: flex; flex-wrap: wrap; gap: 4px; }

  .selzone.on .selbar { visibility: visible; }

  .selbar .btn { background: var(--surface); color: var(--fg); border-color: transparent; }

  .para { display: grid; grid-template-columns: 48px minmax(0, 1fr); }
  .para:last-child { border-bottom: 0; }
  .gut { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; align-items: center; padding-top: 14px; gap: 6px; background: var(--sunk); border-inline-end: 1px solid var(--line); color: var(--muted); font-size: 13px; user-select: none; -webkit-user-select: none; }
  .gut:hover { background: var(--accent-soft); color: var(--accent); }

  .gut .pc { width: 18px; height: 18px; border: 2px solid var(--line); border-radius: 5px; display: grid; place-items: center; font-size: 12px; line-height: 1; color: transparent; background: var(--surface); }
  .para.sel { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }

  .pbody { padding: 4px 6px 8px; min-width: 0; }
  textarea.t.pt { border-color: transparent; background: transparent; border-radius: 8px; padding: 8px 10px; }
  textarea.t.pt:hover { background: color-mix(in srgb, var(--sunk) 60%, transparent); }
  textarea.t.pt:focus { background: var(--surface); }
  textarea.t.pt[readonly] { background: transparent; }
  .pmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding-inline: 8px; font-size: 12px; color: var(--muted); }
  .pbody .cmbox { margin: 6px 8px 4px; }
  .selhint { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .wfeed { flex-basis: 100%; background: var(--sunk); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; gap: 10px; }
  .wfeed .wp { line-height: 2; }
  .wfeed .wp.hl { border-inline-start: 3px solid var(--gold); padding-inline-start: 10px; background: var(--gold-soft); border-radius: 6px; }
  .wfeed .wc { font-size: 14px; color: var(--fg); border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 4px; }
  .wfeed .wc b { color: var(--gold); }
  .hrow.ret { background: color-mix(in srgb, var(--bad) 6%, transparent); border-radius: 10px; padding-inline: 8px; }
  .hist { list-style: none; margin: 0; padding: 8px 0 0; display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); }
  .hist li { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
  .hist .by { color: var(--muted); }
  .hist .txt { font-family: var(--f-en); direction: ltr; text-align: left; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }

  .airev { margin-top: 8px; border: 1px dashed var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; display: grid; gap: 6px; }
  .airev .ah { font-size: 12px; font-weight: 700; color: var(--accent); }
  .airev .at { font-family: var(--f-en); direction: ltr; text-align: left; font-size: 16px; line-height: 1.7; overflow-wrap: anywhere; color: var(--fg); }
  .airev ins { text-decoration: none; background: var(--ok-soft); color: var(--ok); border-radius: 3px; padding: 0 2px; }
  .airev del { background: var(--bad-soft); color: var(--bad); border-radius: 3px; padding: 0 2px; }
  .airev .an { white-space: pre-line; font-size: 13px; color: var(--muted, var(--fg)); }
  .aibar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bar); }
  .aibar select, .rwbar select { width: auto; flex: 0 0 auto; max-width: 100%; }
  .aibar .grow1 { flex: 1 1 220px; }
  .rwbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--bar); margin: 8px 0; }
  .rwbar select, .rwbar input { min-width: 0; }
  .rwbar input[type=text] { flex: 1 1 200px; }
  .rwbox { margin-top: 6px; border: 1px dashed var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; display: grid; gap: 6px; }
  .rwbox .ah { font-size: 12px; font-weight: 700; color: var(--accent); }
  .rwbox .rwt { line-height: 1.9; white-space: pre-wrap; overflow-wrap: anywhere; }
  .aiconn { display: grid; grid-template-columns: minmax(0, 1.4fr) auto minmax(0, 1.6fr) auto; gap: 8px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .aiconn:first-of-type { border-top: 0; }

  .aiconn.off .nm b { color: var(--muted); font-weight: 500; }
  .aitask { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px 12px; align-items: end; padding: 12px 0; border-top: 1px solid var(--line); }
  .aitask:first-of-type { border-top: 0; }
  .aitask .why { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .aitask .full { grid-column: 1 / -1; }
  .stepno { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; margin-inline-end: 8px; }
  @media (max-width: 760px) { .aiconn, .aitask { grid-template-columns: 1fr; } }
  .aigrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
  .mnote { font-size: 13px; background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 6px 12px; direction: ltr; text-align: left; }

  .saved { font-family: var(--f-mono); }

  .gl-list { margin: 8px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 4px 16px; font-size: 14px; }

  .diff { font-family: var(--f-en); direction: ltr; text-align: left; font-size: 17px; line-height: 1.8; overflow-wrap: anywhere; }
  .diff ins { text-decoration: none; background: var(--ok-soft); color: var(--ok); border-radius: 3px; padding: 0 2px; }
  .diff del { background: var(--bad-soft); color: var(--bad); border-radius: 3px; padding: 0 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); align-items: center; }
  .legend ins { text-decoration: none; background: var(--ok-soft); color: var(--ok); border-radius: 3px; padding: 0 6px; }
  .legend del { background: var(--bad-soft); color: var(--bad); border-radius: 3px; padding: 0 6px; }
  .final-text { font-family: var(--f-en); direction: ltr; text-align: left; font-size: 16px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--sunk); border-radius: 8px; padding: 12px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat .v { font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1.3; }
  .stat .l { font-size: 13px; color: var(--muted); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 14px; }
  th, td { text-align: start; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: 0; }
  td.wrapok { white-space: normal; min-width: 160px; }
  td input, td select { min-height: 34px; padding: 4px 8px; }
  .bar { display: inline-block; width: 70px; height: 6px; background: var(--sunk); border-radius: 99px; vertical-align: middle; margin-inline-end: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }

  /* ============ UI upgrade: modern look, motion, responsive ============ */

  // ===================================================================
  // DOCX parsing
  // ===================================================================
  // Word -> segments. Inline formatting is kept as light markers inside the text so it survives every step
  // (translation, review, editing, publishing):  **bold**  *italic*  [text](url)  [^n] footnote reference  \* literal star
  // heading level -> segments.level (1-6); list nesting depth -> level; footnotes -> their own segments "[^n] text" at the end.
  async function parseDocx(file) {
    const buf = await file.arrayBuffer();
    if (!(await window.__loadJs(['mammoth.browser.min.js', 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js', 'https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js'], () => !!window.mammoth, 20000))) throw new Error('کتابخانهٔ خواندن Word بارگذاری نشد. اینترنت/VPN را بررسی و دوباره تلاش کنید.');
    const res = await mammoth.convertToHtml({ arrayBuffer: buf });
    const doc = new DOMParser().parseFromString(res.value, 'text/html');
    const segs = [], found = [], notes = {}, order = [];
    const isNoteLi = li => /^(foot|end)note-\d+$/.test(li.id || '');
    const noteId = a => { const m = /^#(?:foot|end)note-(\d+)$/.exec(a.getAttribute('href') || ''); return m ? 'n' + m[1] + (/endnote/.test(a.getAttribute('href')) ? 'e' : 'f') : null; };
    const wrap = (s, m) => { const mm = /^(\s*)([\s\S]*?)(\s*)$/.exec(s); return mm[2] ? mm[1] + m + mm[2] + m + mm[3] : s; };
    const inline = (n, skipLists) => {
      let out = '';
      n.childNodes.forEach(c => {
        if (c.nodeType === 3) { out += c.nodeValue.replace(/\*/g, '\\*').replace(/\[\^/g, '\\[^'); return; }
        if (c.nodeType !== 1) return;
        const t = c.tagName.toLowerCase();
        if (skipLists && (t === 'ul' || t === 'ol')) return;
        if (t === 'img') return;
        if (t === 'br') { out += ' '; return; }
        if (t === 'sup') {
          const a = c.querySelector('a'), id = a && noteId(a);
          if (id) { if (!order.includes(id)) order.push(id); out += `[^${order.indexOf(id) + 1}]`; return; }
        }
        if (t === 'a') {
          const href = c.getAttribute('href') || '', inner = inline(c);
          if (/^#(?:foot|end)note-ref/.test(href)) return;               // back-link inside a footnote
          if (/^https?:\/\//i.test(href) && inner.trim()) { out += `[${inner.replace(/[\[\]]/g, '')}](${href.replace(/[()\s]/g, encodeURIComponent)})`; return; }
          out += inner; return;
        }
        const inner = inline(c, skipLists);
        if (t === 'strong' || t === 'b') out += wrap(inner, '**');
        else if (t === 'em' || t === 'i') out += wrap(inner, '*');
        else out += inner;
      });
      return out;
    };
    const clean = s => String(s).replace(/\s+/g, ' ').replace(/\*\*\s*\*\*/g, '').trim();
    const add = (kind, text, level) => { text = clean(text); if (text) segs.push({ kind, text, level: level || null }); };
    // footnote bodies first (they sit in a trailing <ol>)
    doc.body.querySelectorAll('li').forEach(li => { if (isNoteLi(li)) { const b = li.cloneNode(true); b.querySelectorAll('a[href^="#footnote-ref"],a[href^="#endnote-ref"]').forEach(a => a.remove()); notes[(/^end/.test(li.id) ? 'n' + li.id.replace(/\D/g, '') + 'e' : 'n' + li.id.replace(/\D/g, '') + 'f')] = inline(b); } });
    const list = (el, depth, ordered) => {
      [...el.children].forEach((li, i) => {
        if (li.tagName.toLowerCase() !== 'li') return;
        li.querySelectorAll('img').forEach(im => found.push({ src: im.getAttribute('src') || '', alt: im.getAttribute('alt') || '', after: segs.length + 1 }));
        add('list_item', (ordered ? (i + 1) + '. ' : '- ') + inline(li, true), Math.min(depth, 6));
        [...li.children].forEach(ch => { const t = ch.tagName.toLowerCase(); if (t === 'ul' || t === 'ol') list(ch, depth + 1, t === 'ol'); });
      });
    };
    doc.body.childNodes.forEach(n => {
      if (n.nodeType !== 1) return;
      const tag = n.tagName.toLowerCase();
      if (tag === 'ol' && [...n.children].some(isNoteLi)) return;
      const txt = inline(n);
      n.querySelectorAll('img').forEach(im => found.push({ src: im.getAttribute('src') || '', alt: im.getAttribute('alt') || '', after: segs.length + (clean(txt) ? 1 : 0) }));
      if (/^h[1-6]$/.test(tag)) add('heading', txt.replace(/^\*\*(.*)\*\*$/, '$1'), +tag[1]);
      else if (tag === 'ul' || tag === 'ol') list(n, 1, tag === 'ol');
      else if (tag === 'table') [...n.querySelectorAll('tr')].forEach(tr => add('paragraph', [...tr.children].map(c => inline(c).trim()).join(' | ')));
      else if (tag === 'blockquote') add('paragraph', txt);
      else add('paragraph', txt);
    });
    // footnotes: renumbered in order of appearance; a reference without a body is dropped, a body without a reference is appended last
    const used = order.filter(id => notes[id] != null);
    const keep = new Map(used.map((id, i) => [order.indexOf(id) + 1, i + 1]));
    segs.forEach(s => { s.text = s.text.replace(/\[\^(\d+)\]/g, (m, d) => keep.has(+d) ? `[^${keep.get(+d)}]` : ''); });
    used.forEach((id, i) => segs.push({ kind: 'footnote', text: `[^${i + 1}] ` + clean(notes[id]), level: null }));
    segs.docImgs = found;
    return segs;
  }
  // images found inside the Word file: decoded here, then attached to the document like any other picture
  async function importDocImages(docId, found) {
    let ok = 0, skip = 0;
    for (const f of (found || []).slice(0, 14)) {
      const m = /^data:(image\/(?:jpeg|png|webp));base64,(.+)$/i.exec(f.src);
      if (!m) { skip++; continue; }
      try {
        const bin = atob(m[2]); if (bin.length < 4000) { skip++; continue; }
        const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        const type = m[1].toLowerCase(), ext = type === 'image/png' ? 'png' : type === 'image/webp' ? 'webp' : 'jpg';
        await pmUpload(docId, new File([u8], `word-image-${ok + 1}.${ext}`, { type }), { alt: f.alt || null, after: f.after > 0 ? f.after : null });
        ok++;
      } catch (e) { skip++; }
    }
    return { ok, skip: skip + Math.max(0, (found || []).length - 14) };
  }

  function aiBar(doc, segs, canAct) {
    const n = segs.filter(g => g.ai_review_text).length, stt = doc.ai_review_state;

    else if (stt === 'failed') msg = `<span class="chip bad">بازبینی ماشینی ناموفق</span> <span class="meta num" dir="ltr">${esc(doc.ai_review_error || '')}</span>`;

    else if (stt === 'done') msg = '<span class="chip ok">بازبینی ماشینی انجام شد</span> <span class="meta">پیشنهادی نبود.</span>';

      ${canAct ? `${n ? '<button type="button" class="btn small primary" data-act="aiacceptall">جایگزینی همهٔ پیشنهادها</button><button type="button" class="btn small quiet" data-act="airejectall">رد همه</button>' : ''}
      <select id="aiRoundsSel" aria-label="تعداد دور بازبینی">${[1, 2, 3].map(k => `<option value="${k}"${(S.aiRounds || 1) === k ? ' selected' : ''}>${fa(k)} دور</option>`).join('')}</select>
      <button type="button" class="btn small" data-act="aireview"${stt === 'running' ? ' disabled' : ''}>بازبینی ماشینی</button>` : ''}</div>`;
  }
  let aiPollT = null;
  function aiWatch() {
    const bar = $('#aiBar');
    if (!bar || bar.dataset.state !== 'running') { clearInterval(aiPollT); aiPollT = null; return; }
    if (aiPollT) return;
    aiPollT = setInterval(async () => {
      const b = $('#aiBar'); if (!b || b.dataset.state !== 'running') { clearInterval(aiPollT); aiPollT = null; return; }
      const a = document.activeElement;
      if (a && a.matches && a.matches('textarea')) return;      // never re-render while someone is typing
      const { data } = await sb.from('documents').select('ai_review_state').eq('id', b.dataset.doc).maybeSingle();
      if (data && data.ai_review_state !== 'running') { clearInterval(aiPollT); aiPollT = null; try { await flushAll(); } catch (_) { /* shown in status */ } render(true); }
    }, 6000);
  }
  function aiRevRemove(sid) {
    const g = segMap[sid]; if (g) { g.ai_review_text = null; g.ai_review_note = null; }
    const b = document.querySelector(`[data-airev="${sid}"]`); if (b) b.remove();
    const bar = $('#aiBar'); if (bar) { const n = Object.values(segMap).filter(x => x.ai_review_text && document.getElementById('seg-' + x.id)).length; if (!n) { const ab = bar.querySelector('[data-act="aiacceptall"]'); if (ab) ab.remove(); const rb = bar.querySelector('[data-act="airejectall"]'); if (rb) rb.remove(); const m = bar.querySelector('.grow1'); if (m) m.innerHTML = '<span class="meta">همهٔ پیشنهادها بررسی شد.</span>'; } }
  }

  async function vEdit() {

    const [d, s] = await Promise.all([sb.from('documents').select('*').eq('id', id).single(), sb.from('segments').select('*').eq('document_id', id).order('position')]);

    segs.forEach(g => { segMap[g.id] = g; });

      ${gl.length || notes.length ? `<details class="gl"><summary>واژه‌نامه و یادداشت‌های ترجمه ماشینی (${fa(gl.length + notes.length)})</summary>
        ${gl.length ? `<ul class="gl-list">${gl.map(g => `<li><span lang="fa">${esc(g.persian)}</span> ← <span class="en" lang="en">${esc(g.english)}</span></li>`).join('')}</ul>` : ''}
        ${notes.length ? `<ul class="gl-list">${notes.map(n => `<li>بند ${fa(n.paragraph_id)}: <span class="en" lang="en">${esc(n.note)}</span></li>`).join('')}</ul>` : ''}</details>` : ''}
      ${ogPanel(segs, g => g.current_text)}
      ${aiBar(doc, segs, editable)}
      <div class="toolbar"><span id="progress" data-total="${segs.length}">${fa(edited)} از ${fa(segs.length)} بند ویرایش شده</span><span class="saved" id="saved">${editable ? 'ذخیره خودکار فعال است' : 'فقط‌خواندنی'}</span></div>
      <div class="segs">${segs.map((g, i) => `<article class="seg${g.flagged ? ' flagged' : ''}" id="seg-${g.id}">
        <div class="seg-head"><span>بند ${fa(i + 1)} · ${KIND_FA(g.kind)}</span><span data-chips="${g.id}">${segChips(g)}</span></div>
        <p class="fa${kcls(g)}" lang="fa" dir="rtl">${fmt(g.source_text)}</p>
        ${ogLine(g, g.current_text, editable)}
        ${notes.filter(n => n.paragraph_id === g.position).map(n => `<div class="mnote" lang="en">${esc(n.note)}</div>`).join('')}
        ${editable ? fbar(g, 'ta-' + g.id, false) : ''}<textarea id="ta-${g.id}" class="t en${g.kind === 'heading' ? ' head' : ''}" dir="ltr" lang="en" rows="2" data-sid="${g.id}" ${editable ? '' : 'readonly'} aria-label="ترجمه انگلیسی بند ${fa(i + 1)}">${esc(g.current_text || '')}</textarea>
        <div class="seg-foot"><button type="button" class="btn quiet small" data-act="hist" data-sid="${g.id}">تاریخچه</button>${cmButton(g.id)}
          ${editable ? `<button type="button" class="btn quiet small" data-act="revert" data-sid="${g.id}">بازگردانی به ترجمه ماشینی</button><button type="button" class="btn quiet small" data-act="flag" data-sid="${g.id}">${g.flagged ? 'برداشتن پرچم' : 'پرچم‌گذاری'}</button>` : ''}</div>
        ${aiRevBox(g)}<div data-histbox="${g.id}"></div>${cmBox(g.id)}</article>${imgAt(inImgs, g)}`).join('')}${inImgs.end || ''}</div>

  let curDoc = null;
  function segChips(g) {
    let h = g.current_text !== g.ai_text ? `<span class="chip gold">ویرایش‌شده · TER ${pct(terOf(g.ai_text, g.current_text))}</span>` : '<span class="chip">ترجمه ماشینی</span>';

  function barHtml(id) {
    return S.confirm === 'submit'
      ? `<span>بعد از ارسال، ویرایش بسته می‌شود. ارسال شود؟</span><span class="row"><button type="button" class="btn primary" data-act="submit" data-id="${id}">بله، ارسال برای ناظر</button><button type="button" class="btn" data-act="cancelc">انصراف</button></span>`
      : `<span class="meta">تغییرات هر بند هنگام مکث یا خروج از کادر ذخیره و در تاریخچه ثبت می‌شود.</span><span class="row"><button type="button" class="btn quiet" data-act="release" data-id="${id}">بازگرداندن به سبد ترجمه</button><button type="button" class="btn primary" data-act="asksubmit">ارسال برای ناظر</button></span>`;
  }

  // ---- autosave -----------------------------------------------------
  const pending = {}, chain = {};
  const st = sid => pending[sid] || (pending[sid] = { secs: 0, dirty: false, startedAt: null, timer: null });
  function setSaved(text, bad) { const el = $('#saved'); if (el) { el.textContent = text; el.classList.toggle('bad', !!bad); } }
  function queueSave(sid) { chain[sid] = (chain[sid] || Promise.resolve()).then(() => doSave(sid)).catch(() => { /* shown in status line */ }); return chain[sid]; }
  async function doSave(sid) {
    const ta = document.getElementById('ta-' + sid); if (!ta || ta.readOnly) return;
    const s = st(sid); const secs = s.secs;
    if (!s.dirty && secs < 3) return;
    const wasDirty = s.dirty; s.secs = 0; s.dirty = false;
    setSaved('در حال ذخیره…');
    const { error } = await sb.rpc('save_segment', { p_segment: sid, p_text: ta.value, p_seconds: secs });
    if (error) { s.secs += secs; s.dirty = s.dirty || wasDirty; setSaved('ذخیره نشد: ' + errText(error), true); throw error; }
    if (segMap[sid]) { segMap[sid].current_text = ta.value; segMap[sid].last_edited_by = me.id; if (S.qa) segUpdate(sid); }
    setSaved('ذخیره شد · ' + clock());
  }
  async function flushAll() {
    document.querySelectorAll('#main textarea[data-sid]').forEach(ta => {
      const s = st(ta.dataset.sid);
      if (s.startedAt) { s.secs += Math.min(600, Math.round((Date.now() - s.startedAt) / 1000)); s.startedAt = Date.now(); }
      queueSave(ta.dataset.sid);
    });
    await Promise.all(Object.values(chain));
    const bad = document.querySelector('#saved.bad');
    if (bad) throw new Error('بعضی تغییرات ذخیره نشده است. دوباره تلاش کنید.');
  }
  function refreshEditedCount() {
    const p = $('#progress'); if (!p) return;
    let n = 0;
    document.querySelectorAll('#main textarea[data-sid]').forEach(ta => { const g = segMap[ta.dataset.sid]; if (g && ta.value !== g.ai_text) n++; });
    p.textContent = `${fa(n)} از ${fa(p.dataset.total)} بند ویرایش شده`;
  }
  async function loadHist(sid) {
    const box = document.querySelector(`[data-histbox="${sid}"]`); if (!box) return;
    if (box.innerHTML) { box.innerHTML = ''; return; }
    box.innerHTML = '<p class="meta">در حال بارگذاری…</p>';
    const { data, error } = await sb.from('segment_revisions').select('revision_no,text,source,author_id,created_at').eq('segment_id', sid).order('revision_no');
    if (error) { box.innerHTML = `<p class="meta">${esc(errText(error))}</p>`; return; }
    // each revision is shown as the changes against the previous one (words added / removed), with who and when on hover
    const who = r => r.source === 'ai' ? 'ترجمه ماشینی' : (nm(r.author_id) || 'کاربر') + (r.source === 'supervisor' ? ' (ناظر)' : '');
    const diffRev = (prev, r) => {
      const ops = diffOps(prev.text, r.text), tip = esc(`${who(r)} · ${fmtT(r.created_at)}`);
      const n = ops.length, keep = new Array(n).fill(false);
      ops.forEach((o, i) => { if (o.t !== 'eq') for (let k = Math.max(0, i - 5); k <= Math.min(n - 1, i + 5); k++) keep[k] = true; });
      const parts = []; let gap = false;
      ops.forEach((o, i) => {
        if (!keep[i]) { gap = true; return; }
        if (gap && parts.length) parts.push('<span class="gap">…</span>'); gap = false;
        parts.push(o.t === 'eq' ? esc(o.w) : o.t === 'del' ? `<del data-tip="${tip}" tabindex="0">${esc(o.w)}</del>` : `<ins data-tip="${tip}" tabindex="0">${esc(o.w)}</ins>`);
      });
      return { html: parts.join(' '), changed: ops.some(o => o.t !== 'eq') };
    };
    const rows = [];
    data.forEach((r, i) => {
      if (i === 0) { rows.push(`<li><span class="hm"><b>${esc(who(r))}</b><span>${fmtT(r.created_at)}</span></span><span class="hd hd0" lang="en">${fmt(r.text)}</span></li>`); return; }
      const d = diffRev(data[i - 1], r);
      rows.push(`<li><span class="hm"><b>${esc(who(r))}</b><span>${fmtT(r.created_at)}</span><span>نسخهٔ ${fa(r.revision_no)}</span></span>${d.changed ? `<span class="hd" lang="en" dir="ltr">${d.html}</span>` : '<span class="meta">بدون تغییر در متن</span>'}</li>`);
    });
    box.innerHTML = `<ul class="hh hist">${rows.join('')}</ul>`;
  }

  // ===================================================================
  // comments on paragraphs
  // ===================================================================
  async function loadComments(docId) {
    S.cmDoc = docId; S.cm = {};
    try {
      const { data, error } = await sb.from('segment_comments').select('id,segment_id,author_id,body,resolved,created_at').eq('document_id', docId).order('created_at');
      if (error) throw error;
      data.forEach(c => { (S.cm[c.segment_id] = S.cm[c.segment_id] || []).push(c); });
    } catch (_) { /* comments are optional: the page still works without them */ }
  }
  function cmUnresolved(sid) { return (S.cm[sid] || []).filter(c => !c.resolved).length; }
  function cmIsOpen(sid) { return S.cmOpen[sid] !== undefined ? S.cmOpen[sid] : cmUnresolved(sid) > 0; }
  function cmBtnLabel(sid) {
    const a = S.cm[sid] || [], u = cmUnresolved(sid);
    return a.length ? (u ? `${fa(u)} نظر باز` : `${fa(a.length)} نظر`) : 'نظر';
  }
  function cmButton(sid) {
    return `<button type="button" class="btn quiet small${cmUnresolved(sid) ? ' cm-open' : ''}" data-act="cmtoggle" data-sid="${sid}" data-cmbtn="${sid}">${cmBtnLabel(sid)}</button>`;
  }
  function cmListHtml(sid) {
    const a = S.cm[sid] || [];
    if (!a.length) return '<p class="meta">هنوز نظری نیست.</p>';
    return a.map(c => `<div class="cm${c.resolved ? ' done' : ''}"><div class="cm-h"><b>${esc(nm(c.author_id))}</b><span class="meta">${fmtT(c.created_at)}</span>${c.resolved ? '<span class="chip ok">حل‌شد</span>' : ''}<button type="button" class="btn quiet small" data-act="cmresolve" data-id="${c.id}" data-sid="${sid}" data-v="${c.resolved ? 0 : 1}">${c.resolved ? 'بازکردن دوباره' : 'حل‌شد'}</button></div><p>${esc(c.body)}</p></div>`).join('');
  }
  function cmBox(sid) {
    return `<div class="cmbox" data-cmbox="${sid}"${cmIsOpen(sid) ? '' : ' hidden'}><div data-cmlist="${sid}">${cmListHtml(sid)}</div><div class="cmform"><textarea class="plain" rows="2" id="cmin-${sid}" data-cmin="${sid}" aria-label="نظر جدید" placeholder="نظر بنویسید…"></textarea><button type="button" class="btn small primary" data-act="cmadd" data-sid="${sid}">ثبت نظر</button></div></div>`;
  }
  function cmRefresh(sid) {
    const l = document.querySelector(`[data-cmlist="${sid}"]`); if (l) l.innerHTML = cmListHtml(sid);
    const b = document.querySelector(`[data-cmbtn="${sid}"]`);
    if (b) { b.textContent = cmBtnLabel(sid); b.classList.toggle('cm-open', cmUnresolved(sid) > 0); }

  async function cmRefreshFor(docId) {
    if (S.cmDoc !== docId || !(S.docId === docId || S.qa === docId)) return;

    document.querySelectorAll('[data-cmlist]').forEach(el => cmRefresh(el.dataset.cmlist));

  // ===================================================================
  // publication priority (1-5 stars)
  // ===================================================================
  const RATING_LABEL = ['', 'کم‌اهمیت', 'معمولی', 'مهم', 'بسیار مهم', 'خبر اصلی'];
  async function loadPrintMin() {
    try {
      const { data, error } = await sb.from('app_config').select('value').eq('key', 'print_min_priority').maybeSingle();
      const v = Number(data && data.value);
      if (!error && v >= 1 && v <= 5) S.printMin = v;
    } catch (_) { /* keep the previous value */ }
    if (!S.printMin) S.printMin = 4;
    return S.printMin;
  }
  function starsStatic(n) {
    if (!n) return '<span class="chip">بدون رتبه</span>';
    return `<span class="stars-ro" role="img" aria-label="رتبه ${fa(n)} از ۵"><span class="on">${'★'.repeat(n)}</span><span class="off">${'★'.repeat(5 - n)}</span></span>`;
  }
  function starsEdit(id, n) {
    return `<span class="stars sm" role="group" aria-label="رتبه">${[1, 2, 3, 4, 5].map(i => `<button type="button" class="star${n >= i ? ' on' : ''}" data-act="setprio" data-id="${id}" data-n="${i}" aria-label="${fa(i)} ستاره" title="${RATING_LABEL[i]}">★</button>`).join('')}</span>`;
  }
  function qaPrioInner(doc, pm, mine) {
    const hint = doc.priority ? `<span class="meta">${ratingHint(doc.priority, pm)} · ${mine ? 'تغییر داده‌شده توسط شما' : 'تعیین‌شده توسط بازبین محتوا'}</span>` : '<span class="chip">بدون رتبه</span><span class="meta">این فایل رتبه ندارد. با ستاره، اولویت نشر را تعیین کنید.</span>';
    return `<div class="row"><b>اولویت نشر</b>${starsEdit(doc.id, doc.priority || 0).replace(/data-act="setprio"/g, 'data-act="qaprio"')}${hint}</div>
      <p class="meta" style="margin-top:6px">ناظر می‌تواند رتبهٔ بازبین را تغییر دهد. تغییر بلافاصله ثبت می‌شود و در تاریخچهٔ رتبه می‌ماند.</p>`;
  }
  function ratingShort(n, pm) { return `${RATING_LABEL[n]} · ${n >= pm ? 'نشریه و سایت' : 'فقط سایت'}`; }
  function ratingHint(n, pm) {
    return `رتبه ${fa(n)}: ${RATING_LABEL[n]} · ${n >= pm ? 'در نشریه و سایت منتشر می‌شود' : 'فقط در سایت منتشر می‌شود'}`;

  // ===================================================================
  // view: supervisor
  // ===================================================================
  VIEWS.qa = async function () {
    if (S.qa) return vQA();
    const { data, error } = await sb.from('documents').select('id,title,claimed_by,word_count,updated_at').eq('status', 'awaiting_qa').order('updated_at');
    if (error) throw error;
    let q = {};
    if (data.length) {
      const r = await sb.from('document_quality').select('document_id,segments,unchanged_pct,ter').in('document_id', data.map(d => d.id));
      (r.data || []).forEach(x => { q[x.document_id] = x; });
    }
    return head('بازبینی ناظر', 'تفاوت ترجمه ماشینی و ترجمه مترجم را ببینید، سپس تایید کنید یا با یادداشت برگردانید.') +
      (data.length ? `<div class="list">${data.map(d => { const x = q[d.id]; return `<article class="card"><div class="item"><div class="item-main"><div class="item-title">${esc(d.title)}</div>
        <div class="meta">مترجم: ${esc(nm(d.claimed_by))} · ${fa(d.word_count)} کلمه${x ? ` · بدون تغییر ${fa(x.unchanged_pct)}٪ · TER ${pct(Number(x.ter))}` : ''}</div></div>
        <button type="button" class="btn primary" data-act="qaopen" data-id="${d.id}">بررسی</button></div></article>`; }).join('')}</div>` : emptyCard('فایلی در انتظار ناظر نیست.'));
  };
  const diffHtml = g => g.current_text === g.ai_text ? esc(g.current_text) : diffOps(g.ai_text, g.current_text).map(o => o.t === 'eq' ? esc(o.w) : o.t === 'del' ? `<del>${esc(o.w)}</del>` : `<ins>${esc(o.w)}</ins>`).join(' ');
  const qaChips = g => (g.current_text === g.ai_text ? '<span class="chip ok">بدون تغییر</span>' : `<span class="chip gold">TER ${pct(terOf(g.ai_text, g.current_text))}</span>`)
    + (g.flagged ? ' <span class="chip bad">پرچم‌دار</span>' : '') + (me && g.last_edited_by === me.id ? ' <span class="chip accent">ویرایش ناظر</span>' : '');
  async function vQA() {
    const id = S.qa;
    const [d, s] = await Promise.all([sb.from('documents').select('*').eq('id', id).single(), sb.from('segments').select('*').eq('document_id', id).order('position')]);
    if (d.error) { S.qa = null; throw d.error; }
    if (d.data.status !== 'awaiting_qa') { S.qa = null; return VIEWS.qa(); }
    const doc = d.data, segs = s.data;
    segs.forEach(g => { segMap[g.id] = g; });
    await loadComments(id); await loadOG();
    const pm = await loadPrintMin();

  async function prepImage(file) {
    if (!PM_TYPES.includes(file.type)) throw new Error('فقط تصویر JPG، PNG یا WebP پذیرفته می‌شود.');
    if (file.size > 25 * 1024 * 1024) throw new Error('حجم تصویر بیشتر از ۲۵ مگابایت است.');
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('تصویر خوانده نشد.')); i.src = url; });
      const k = Math.min(1, 2400 / Math.max(img.naturalWidth, img.naturalHeight));
      if (k === 1 && file.size <= 5 * 1024 * 1024) return { blob: file, type: file.type };

  // ===================================================================
  // organizational glossary (واژه‌نامه سازمان)
  // ===================================================================
  let OG = [];
  function normFa(t) {
    return String(t || '').replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/ة/g, 'ه')
      .replace(/[‌‏‎ـ]/g, ' ').replace(/[ً-ٰٟ]/g, '')
      .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
      .replace(/\s+/g, ' ').trim().toLowerCase();
  }
  async function loadOG() {
    const r = await sb.from('glossary').select('*').eq('is_active', true).order('source_term');
    OG = r.error ? [] : r.data;   // table missing (update 7 not run) simply means: no glossary
  }
  function ogHits(srcText) {
    const t = ' ' + normFa(srcText) + ' ';
    return OG.filter(e => { const k = normFa(e.source_term); return k && t.includes(k); });
  }
  const ogHas = (en, target) => String(en || '').toLowerCase().replace(/\s+/g, ' ').includes(String(target).toLowerCase().replace(/\s+/g, ' ').trim());
  // chips under one source paragraph: green = target term present, amber = missing (click to insert, translator only)
  function ogLine(g, en, canInsert) {
    const hits = ogHits(g.source_text); if (!hits.length) return '';
    return `<div class="ogline" data-og="${g.id}"><span class="meta">واژه‌نامه سازمان:</span>${ogChips(g, en, canInsert, hits)}</div>`;
  }
  function ogChips(g, en, canInsert, hits) {
    hits = hits || ogHits(g.source_text);
    return hits.map(e => {
      const ok = ogHas(en, e.target_term);
      const inner = `<span lang="fa">${esc(e.source_term)}</span> = <span class="en" lang="en">${esc(e.target_term)}</span>`;
      const tip = esc(e.note || '');
      return ok ? `<span class="ogc ok" title="${tip}">${inner}</span>`
        : canInsert ? `<button type="button" class="ogc bad" data-act="oginsert" data-sid="${g.id}" data-term="${esc(e.target_term)}" title="${tip}">${inner} · درج</button>`
        : `<span class="ogc bad" title="${tip}">${inner} · در ترجمه نیست</span>`;
    }).join('');
  }
  function ogSummary(segs, textOf) {
    const hits = new Map(); let bad = 0;
    segs.forEach(g => {
      const h = ogHits(g.source_text); let miss = false;
      h.forEach(e => { if (!hits.has(e.id)) hits.set(e.id, { e, n: 0, miss: 0 }); const o = hits.get(e.id); o.n++; if (!ogHas(textOf(g), e.target_term)) { o.miss++; miss = true; } });
      if (miss) bad++;
    });
    return { terms: [...hits.values()], bad };
  }
  function ogPanel(segs, textOf) {
    const { terms, bad } = ogSummary(segs, textOf); if (!terms.length) return '';
    return `<details class="gl og" id="ogPanel" ${bad ? 'open' : ''}><summary>واژه‌نامه سازمان: ${fa(terms.length)} اصطلاح در این فایل${bad ? ` · <b class="ogbad">${fa(bad)} بند مغایر</b>` : ' · همه رعایت شده'}</summary>
      <ul class="gl-list">${terms.map(o => `<li class="${o.miss ? 'ogbad' : ''}"><span lang="fa">${esc(o.e.source_term)}</span> = <span class="en" lang="en">${esc(o.e.target_term)}</span> <span class="meta">(${fa(o.n)} بند${o.miss ? '، ' + fa(o.miss) + ' مغایر' : ''})</span></li>`).join('')}</ul></details>`;
  }
  function ogRefresh(sid, text, canInsert) {
    const g = segMap[sid]; if (!g) return;
    const box = document.querySelector(`[data-og="${sid}"]`); if (box) box.innerHTML = '<span class="meta">واژه‌نامه سازمان:</span>' + ogChips(g, text, canInsert);
    const p = document.getElementById('ogPanel'); if (p) {
      const segs = Object.values(segMap).filter(x => x.document_id === g.document_id).sort((a, b) => a.position - b.position);
      const cur = id => { const ta = document.getElementById('ta-' + id); return ta ? ta.value : segMap[id].current_text; };
      const { terms, bad } = ogSummary(segs, x => cur(x.id));
      p.querySelector('summary').innerHTML = `واژه‌نامه سازمان: ${fa(terms.length)} اصطلاح در این فایل${bad ? ` · <b class="ogbad">${fa(bad)} بند مغایر</b>` : ' · همه رعایت شده'}`;
      p.querySelector('ul').innerHTML = terms.map(o => `<li class="${o.miss ? 'ogbad' : ''}"><span lang="fa">${esc(o.e.source_term)}</span> = <span class="en" lang="en">${esc(o.e.target_term)}</span> <span class="meta">(${fa(o.n)} بند${o.miss ? '، ' + fa(o.miss) + ' مغایر' : ''})</span></li>`).join('');
    }
  }

  function parseBulk(txt) {
    return String(txt || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
      let a, b, note = '';
      const bar = l.split('|'); const main = bar[0]; note = (bar[1] || '').trim();
      if (main.includes('\t')) [a, b] = main.split('\t'); else if (main.includes('=')) { const i = main.indexOf('='); a = main.slice(0, i); b = main.slice(i + 1); } else return null;
      return { source: (a || '').trim(), target: (b || '').trim(), note };
    }).filter(Boolean);
  }

g pronoun\",\"problem\":\"exact quote\",\"explanation\":\"توضیح کوتاه به فارسی\",\"correction\":\"corrected text\"}]}","rewrite":"You are an experienced Persian news editor.\n\nYou receive a JSON array. Each element has \"id\" and \"text\" (one paragraph or heading of a Persian news item):\n{{PARAGRAPHS_JSON}}\n\nRewrite every text in Persian according to this instruction:\n{{INSTRUCTION}}\n\nRules:\n- Keep every fact, name, number, date, title and quotation exactly as in the original. Never add information that is not in the text.\n- Write natural, correct Persian (use the half-space ZWNJ properly); keep a heading short.\n- If a text needs no change, return it unchanged.\n- Keep inline markers exactly: **bold**, *italic*, [link text](url) and footnote references such as [^1].\n\nReturn ONLY one valid JSON object, no markdown fences and no other text, exactly in this shape:\n{\"items\":[{\"id\":1,\"text\":\"the rewritten Persian text\"}]}\nReturn exactly one item for every input element, with the same \"id\" values and in the same order."};

    const n = S.sel.size; const hd = $('.top'); if (hd) document.documentElement.style.setProperty('--hdr', hd.offsetHeight + 'px');
    $('#selZone').classList.toggle('on', n > 0); $('#selN').textContent = fa(n) + ' بند انتخاب شده';

  }
  let selDrag = null;
  document.addEventListener('pointerdown', e => {
    const gut = e.target.closest && e.target.closest('.gut'); if (!gut || (e.button && e.button !== 0)) return;
    const paras = [...document.querySelectorAll('.para')], p = gut.closest('.para'), i = paras.indexOf(p);
    if (!S.sel) S.sel = new Set();
    if (e.shiftKey && S.lastSel != null && S.lastSel !== i) {
      const a = Math.min(i, S.lastSel), b = Math.max(i, S.lastSel); for (let k = a; k <= b; k++) setSel(paras[k], true);
    } else { const v = !S.sel.has(p.dataset.sid); setSel(p, v); selDrag = { v }; }
    S.lastSel = i; selRefresh(); e.preventDefault();
  });

    }
  });
  document.addEventListener('toggle', e => { if (e.target && e.target.id === 'rwBar') S.rwOpen = e.target.open; if (e.target && e.target.open && e.target.querySelector && e.target.querySelector('[data-pmeta]')) hydratePmeta(); }, true);
  document.addEventListener('focusout', e => {
    const t = e.target;
    if (t.matches && t.matches('textarea[data-sid]')) {
      const s = st(t.dataset.sid);
      if (s.startedAt) { s.secs += Math.min(600, Math.round((Date.now() - s.startedAt) / 1000)); s.startedAt = null; }
      clearTimeout(s.timer); queueSave(t.dataset.sid);
    }
  });
  document.addEventListener('change', async e => {
    const t = e.target;
    try {
      if (t.matches && t.matches('[data-pavatar]')) {
        const f = (t.files || [])[0]; if (!f) return; const id = t.dataset.pavatar; t.value = '';
        try { checkAvatarFile(f); toast('در حال ارسال عکس…'); const av = await resizeAvatar(f); const orig = await uploadAvatarOriginal(f, mime => fnCall('manage-users', { action: 'avatar_upload_url', user_id: id, mime })); await fnCall('manage-users', { action: 'set_avatar', user_id: id, avatar: av, orig_path: orig }); toast('عکس پروفایل تغییر کرد.'); await loadNames(); if (me && me.id === id) { const r = await sb.from('profiles').select('avatar_url').eq('id', id).single(); if (r.data) me.avatar_url = r.data.avatar_url; } render(); }
        catch (e) { toast(errText(e)); }
        return;
      }
      if (t.matches && t.matches('[data-pmup]')) {
        const files = [...(t.files || [])], id = t.dataset.pmup, box = t.closest('[data-pmeta]'); t.value = '';
        let ok = 0; for (const f of files) { try { await pmUpload(id, f); ok++; } catch (e) { toast(`${f.name}: ${errText(e)}`); } }
        if (ok) toast(me.role === 'writer' || me.role === 'journal_writer' ? `${fa(ok)} تصویر بارگذاری شد؛ بعد از تایید بازبین استفاده می‌شود.` : `${fa(ok)} تصویر بارگذاری شد.`);
        if (box) { box.dataset.ready = '0'; await hydratePmeta(); }
        return;
      }
      if (t.matches && t.matches('[data-pmf]')) { const box = t.closest('[data-pmeta]'); try { await pmSaveMeta(box); const c = box.querySelector(`[data-cnt="${t.dataset.pmf}"]`); if (c) c.textContent = fa(t.value.length) + '/' + fa(t.dataset.pmf === 'seo_title' ? 60 : 160); toast('ذخیره شد.'); } catch (e) { toast(errText(e)); } return; }
      if (t.matches && t.matches('[data-pmi]')) { const box = t.closest('[data-pmeta]'); try { await pmSaveImg(box, t.closest('[data-imgid]')); toast('ذخیره شد.'); } catch (e) { toast(errText(e)); } return; }
      if (t.id === 'wImgs') { S.wImgs = [...(t.files || [])].slice(0, 12); t.value = ''; render(); return; }
      if (t.id === 'upKind') { S.upKind = t.value; }
      else if (t.id === 'seniorOnly') { S.seniorOnly = t.checked; }
      else if (t.id === 'fileIn') { const f = t.files && t.files[0]; if (f) await doUpload(f); t.value = ''; }
      else if (t.id === 'wFix') { const f = t.files && t.files[0]; t.value = ''; const rid = S.fixFor; S.fixFor = null; if (f && rid) await doWriterUpload(f, rid); }
      else if (t.id === 'wFile') { const f = t.files && t.files[0]; t.value = ''; if (f) await doWriterUpload(f); }
      else if (t.id === 'suAvatar') {
        const f = t.files && t.files[0]; t.value = ''; if (!f) return;
        checkAvatarFile(f); AVATAR = await resizeAvatar(f); AVATAR_FILE = f;
        const pv = $('#suPrev'); pv.style.backgroundImage = `url(${AVATAR})`; pv.classList.add('has'); pv.innerHTML = '';
      }
      else if (t.id === 'rwStyle') { S.rwStyle = t.value; const i = $('#rwInstr'); if (i) i.placeholder = t.value === 'custom' ? 'دستور بازنویسی (لازم است)' : 'توضیح اضافه (اختیاری)'; }
      else if (t.id === 'aiRoundsSel') { S.aiRounds = Number(t.value) || 1; }
      else if (t.matches('textarea[data-fa]')) { const { error } = await sb.from('segments').update({ source_text: t.value }).eq('id', t.dataset.fa); if (error) throw error; }
      else if (t.matches('[data-kindsel]')) {
        const [k, l] = t.value.split(':'), patch = { kind: k, level: l ? +l : (k === 'list_item' ? 1 : null) };
        const { error } = await sb.from('segments').update(patch).eq('id', t.dataset.kindsel); if (error) throw error;
        await render(); toast('نوع بند ذخیره شد.');
      }
      else if (t.matches('[data-plevel]')) { await rpc('set_translator_level', { p_user: t.dataset.plevel, p_level: t.value }); toast('رتبهٔ مترجم ذخیره شد.'); }
      else if (t.matches('[data-ptitle]')) { await rpc('set_publish_title', { p_doc: t.dataset.ptitle, p_title: t.value }); toast('عنوان ذخیره شد.'); }
      else if (t.matches('[data-prole]')) { const { error } = await sb.from('profiles').update({ role: t.value }).eq('id', t.dataset.prole); if (error) throw error; toast('نقش ذخیره شد.'); await loadNames(); }
      else if (t.matches('[data-pphone]')) { const v = t.value.trim(); if (v && !/^[+\d\s()-]{6,20}$/.test(v)) throw new Error('شمارهٔ تماس معتبر نیست.'); const { error } = await sb.from('profile_contacts').upsert({ id: t.dataset.pphone, phone: v || null }); if (error) throw error; toast('تلفن ذخیره شد.'); await loadNames(); }
      else if (t.matches('[data-pname]')) { const { error } = await sb.from('profiles').update({ full_name: t.value.trim() }).eq('id', t.dataset.pname); if (error) throw error; toast('نام ذخیره شد.'); await loadNames(); }
      else if (t.matches('[data-pnotify]')) { const { error } = await sb.from('profiles').update({ notify: t.checked }).eq('id', t.dataset.pnotify); if (error) throw error; toast('ذخیره شد.'); }
    } catch (err) { toast(errText(err)); S.busy = ''; if (me) render(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.panel) { S.panel = false; setBell(); } });
  window.addEventListener('beforeunload', e => {
    const dirty = Object.values(pending).some(p => p.dirty);
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  boot();
})();
</script>
</body>
</html>
